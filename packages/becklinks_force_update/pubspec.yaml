name: becklinks_force_update
description: "Force update for Flutter apps on Android and iOS: ask Beck Links whether the running version is too old, offer or require an update, and send people to the store."
version: 0.1.0
homepage: https://becklinks.com
documentation: https://docs.becklinks.com/force-update
repository: https://github.com/Tecbeckp/becklinks-sdks/tree/main/packages/becklinks_force_update
issue_tracker: https://github.com/Tecbeckp/becklinks-sdks/issues
resolution: workspace

topics:
  - force-update
  - app-update
  - version-check
  - beck-links

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  becklinks_core: ^0.1.0
  flutter:
    sdk: flutter
  # Lower bounds are the oldest versions that work on Flutter 3.27; newer Flutter picks newer ones.
  meta: ^1.15.0
  package_info_plus: ">=8.0.0 <11.0.0"
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  http: ^1.6.0
