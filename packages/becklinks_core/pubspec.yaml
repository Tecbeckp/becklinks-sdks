name: becklinks_core
description: "Shared API client for the Beck Links Flutter packages: publishable key checks, HTTP with retries and backoff, one exception type and a small logger."
version: 0.1.1
homepage: https://becklinks.com
documentation: https://docs.becklinks.com
repository: https://github.com/Tecbeckp/becklinks-sdks/tree/main/packages/becklinks_core
issue_tracker: https://github.com/Tecbeckp/becklinks-sdks/issues
resolution: workspace

topics:
  - beck-links
  - api-client
  - http
  - retry
  - sdk

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
